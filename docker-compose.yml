services:
  db:
    image: postgres:16-alpine
    container_name: puds_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: puds
      POSTGRES_PASSWORD: puds
      POSTGRES_DB: puds_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U puds -d puds_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
